name: k22i

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      # 2600 inside too: the unprivileged nginx image cannot bind 80, and one port everywhere.
      - "${WEB_PORT:-2600}:2600"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      # Appended to the SPA's `connect-src` (see apps/web/nginx.conf.template).
      # Only MinIO: the API is same-origin now, reached through this container's
      # own /rpc proxy, so `'self'` covers it. Uploads go straight
      # from the page to a presigned URL and never touch the server, which is why
      # the bucket still has to be named here — leave it out and uploads break
      # while everything else keeps working, which is a confusing way to find out.
      CSP_CONNECT_SRC: http://localhost:${MINIO_PORT:-5300}
      # What nginx proxies the two API prefixes to, over the compose network.
      # Note the port is ${SERVER_PORT}, not a fixed 1900: the server binds
      # PORT to that same variable, so it moves the container-internal port too.
      SERVER_UPSTREAM: http://server:${SERVER_PORT:-1900}
    # Healthchecks for web, server and workers live in their Dockerfiles.
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    # Skip migrate-on-boot: the local database is push-built.
    command: ["node", "dist/index.mjs"]
    # No published port: as in production, the API is reached only through the
    # web container's proxy.
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      PORT: ${SERVER_PORT:-1900}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-2600}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/k22i
      # Server -> bucket, over the compose network.
      S3_ENDPOINT: http://minio:9000
      # Host baked into presigned URLs; must be reachable from the browser, not from this container.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-5300}
      S3_BUCKET: ${S3_BUCKET:-k22i}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      # Server -> Redis, over the compose network. Unlike MinIO there is no
      # public-endpoint twin here — nothing about Redis is ever handed to a
      # browser, so no client-reachable host needs to be baked into anything.
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Consumes the job queue. No ports published: the HTTP server it runs exists
  # only for the image's healthcheck and for Prometheus to scrape from inside the
  # compose network.
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    init: true
    env_file:
      - path: apps/workers/.env
        required: false
    environment:
      SERVICE_NAME: k22i-workers
      WORKERS_PORT: ${WORKERS_PORT:-1901}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/k22i
      # Import jobs read uploaded CSVs from the bucket over the compose network.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-k22i}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: k22i-postgres
    environment:
      POSTGRES_DB: k22i
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-4400}:5432"
    volumes:
      - k22i_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: k22i-redis
    init: true
    # `--save 60 1` is one snapshot a minute if at least one key changed. Nothing
    # here is authoritative, so this exists only so a
    # `docker compose restart` does not reset everyone's rate-limit budget.
    command: ["redis-server", "--save", "60", "1"]
    ports:
      # 6666 on the host; the container-internal port stays 6379, so the
      # compose-network REDIS_URL on the server service is unaffected.
      - "${REDIS_PORT:-6666}:6379"
    volumes:
      - k22i_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: k22i-minio
    init: true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Presigned PUTs go straight to the bucket, bypassing the server's own CORS
      # config, so MinIO is what has to allow the web origin. This build does not
      # implement the per-bucket PutBucketCors API — it is a server-level setting.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${WEB_PORT:-2600}
    ports:
      - "${MINIO_PORT:-5300}:9000"
      - "${MINIO_CONSOLE_PORT:-5301}:9001"
    volumes:
      - k22i_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: creates the bucket. CORS is configured on the minio service above.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    init: true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-k22i}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "minio ready: bucket $$S3_BUCKET"
    restart: "no"

volumes:
  k22i_postgres_data:
  k22i_minio_data:
  k22i_redis_data:
