name: pod-widgets-vps

services:
  caddy:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    init: true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Lose these and Caddy re-requests certificates, which Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # The admin API, not :80: with a domain, :80 redirects to https and wget fails.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      SERVER_UPSTREAM: http://server:1900
      # Only needed once uploads are on; see .env.vps.example.
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    # No published port: Caddy reaches it over the compose network.
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    init: true
    # No `command`: the image default migrates on boot, so keep it one replica.
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set in .env.vps}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env.vps}@postgres:5432/trumpet-pods
      # Caddy -> nginx -> server: one fewer and every caller shares Caddy's IP.
      TRUSTED_PROXY_HOPS: 2
      # Inert until #18 wires uploads; empty values read as unset.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: trumpet-pods
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.vps}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Profile "uploads": nothing uses object storage until #18. The password has
  # no `:?` because compose interpolates inactive profiles too, which would
  # break every command; an empty one makes minio itself refuse to start.
  minio:
    profiles: [uploads]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    init: true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      # Presigned PUTs bypass the server's CORS and this build has no per-bucket CORS API.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?set in .env.vps}
    ports:
      # The browser PUTs here directly; S3_PUBLIC_ENDPOINT must point at this port.
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    profiles: [uploads]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    init: true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-pod-widgets}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

configs:
  caddyfile:
    file: ./Caddyfile

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
